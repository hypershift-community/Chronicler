[project]
name = "chronicler"
version = "0.1.0"
description = "Turn progress updates into polished blog posts"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "textual>=3.0",
    "anthropic[vertex]>=0.52",
]

[project.scripts]
chronicler = "chronicler.app:cli"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
